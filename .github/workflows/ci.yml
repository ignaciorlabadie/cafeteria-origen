name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Levantar app + BD
        run: docker compose up -d --build

      - name: Esperar a /api/salud
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/api/salud').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Tests funcionales
        run: docker compose exec -T app npm test

      - name: Logs si falla
        if: failure()
        run: docker compose logs --no-color

      - name: Bajar y limpiar
        if: always()
        run: docker compose down -v